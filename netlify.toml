# Static site — nothing to compile, publish the repo root as-is.
[build]
  publish = "."
  command = ""

# The leaderboard snapshot is rewritten every night, so it must never be served
# from cache. Without this the board looks frozen even though the data commit
# landed, and the whole pipeline appears broken.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
